services:
  # API for the ClearTrace app, so users don't need their own key
  - type: web
    name: cleartrace-api
    runtime: python
    plan: free
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false   # paste the key in the Render dashboard, never in code
